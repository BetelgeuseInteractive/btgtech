name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, data generation and game tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # Also validates the Gradle wrapper jar against the checksums published by Gradle.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build

      - name: Run data generation
        run: ./gradlew runData

      - name: Check that the generated resources are committed
        run: |
          changes="$(git status --porcelain -- src/generated)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::Generated resources differ from the committed output. Run gradlew runData and commit the result."
            exit 1
          fi

      - name: Run game tests
        run: ./gradlew runGameTestServer
